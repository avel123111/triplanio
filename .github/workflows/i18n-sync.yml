# Tolgee → репозиторий: синхронизация переводов ОТДЕЛЬНЫМ воркфлоу (TRIP-134, переделка).
#
# ЗАЧЕМ ОТДЕЛЬНО, А НЕ ВНУТРИ ДЕПЛОЯ. Раньше это была джоба `tolgee_sync` внутри
# supabase-deploy.yml, стоявшая блокирующим звеном перед migrate → deploy → vercel.
# Два дефекта такой конструкции, оба выстрелили:
#
#   1. Она писала в `dev` ПРЯМЫМ ПУШЕМ. `dev` защищён правилом с обязательным
#      статус-чеком `gate / Frontend (lint / test / build)`, а этот чек порождает
#      ТОЛЬКО ci.yml по событию `pull_request`. У коммита, приехавшего прямым пушем,
#      события `pull_request` не бывает — значит требуемый контекст на нём не может
#      существовать по построению, и GH006 неизбежен ВСЕГДА (не гонка, не флак:
#      0 успешных пушей из ~600 прогонов с 17.07.2026).
#   2. Её падение роняло весь деплой (у migrate/deploy/vercel стояло
#      `needs.tolgee_sync.result == 'success'`). Именно поэтому 17.07 ошибку пуша
#      заглушили через `|| echo ::warning` — иначе не катились функции и миграции.
#      Заглушка вернула джобе зелёный, notify стал печатать `✅ tolgee sync`, и
#      единственный индикатор поломки исчез вместе с ней. Переводы не доезжали до
#      пользователя пять недель при полностью зелёном пайплайне.
#
# КАК ЗДЕСЬ. Переводы едут в репозиторий тем же путём, что весь остальной код:
# ветка → pull request → гейт → мердж. У бота нет привилегий и нет исключений из
# процесса. Следствия, важные каждое по отдельности:
#   • не нужен обход branch protection — пуш идёт в НЕзащищённую ветку;
#   • контент Tolgee впервые проходит гарды 2d (дубли ключей) и 2x (семьи
#     notif.tpl_* / n8n.*): раньше коммит нёс `[skip ci]` и не проверялся ничем;
#   • дельта видна в диффе ДО посадки — Tolgee перезаписывает файлы целиком, и
#     ключ, заведённый в репо мимо Tolgee, был бы снесён молча;
#   • этот воркфлоу больше ничего не блокирует, поэтому ему МОЖНО падать красным.
#     Отсюда правило ниже.
#
# ★ ПРАВИЛО ЭТОГО ФАЙЛА: никаких `|| echo`, `continue-on-error` и «мягких» exit 0
# при отсутствии секретов. Ровно эта «вежливость» и породила пятинедельную немоту.
# Здесь отказ обязан быть красным — он никого не задерживает.
#
# ПОЧЕМУ ЦЕЛЬ ЖЁСТКО `dev`, А НЕ `github.ref_name`. `schedule` и кнопка
# «Run workflow» работают только для воркфлоу, лежащего на DEFAULT-ветке (здесь
# `main`). То есть определение живёт на `main`, а синкать надо `dev` — единственную
# точку, куда переводы садятся (на `main` они приезжают мерджем dev→main, CI в
# `main` не коммитит никогда). Жёсткая цель заодно исключает случайный PR в `main`,
# если кто-то запустит воркфлоу с другой ветки.
#
# СЕКРЕТЫ:
#   TOLGEE_API_KEY   — ключ проекта Tolgee (уже есть в репозитории).
#   I18N_SYNC_TOKEN  — fine-grained PAT на avel123111/triplanio, права
#                      `Contents: write` + `Pull requests: write`.
#                      ЗАЧЕМ ОТДЕЛЬНЫЙ ТОКЕН: GITHUB_TOKEN намеренно НЕ порождает
#                      события workflow (защита GitHub от рекурсии). PR, открытый
#                      под ним, не запустил бы ci.yml, требуемый чек не появился бы
#                      и PR остался бы немержаемым — та же стена, что у прямого
#                      пуша, просто шагом позже.
#                      ЭТО НЕ ОБХОД ЗАЩИТЫ: токен не позволяет пропустить ни одну
#                      проверку. PR обязан позеленеть и быть смерджённым человеком.
#                      Токен даёт ровно одно — чтобы CI на этом PR реально стартовал.
name: Sync translations from Tolgee

on:
  # Раз в сутки. Работает только с default-ветки (`main`) — см. блок про цель выше.
  schedule:
    - cron: '0 6 * * *'
  # Actions → «Sync translations from Tolgee» → «Run workflow»: подтянуть сейчас,
  # не дожидаясь крона. Кнопка тоже появляется только после того, как этот файл
  # доедет до `main`.
  workflow_dispatch:

# Ветка синка одна на репозиторий, и каждый прогон пересобирает её целиком.
# Два параллельных прогона перетёрли бы друг друга — очередь, без отмены.
concurrency:
  group: i18n-sync
  cancel-in-progress: false

# GITHUB_TOKEN здесь не используется ВООБЩЕ: checkout, push и создание PR идут под
# I18N_SYNC_TOKEN (см. блок про секреты). Пустой набор прав фиксирует это явно.
permissions: {}

jobs:
  sync:
    name: Pull from Tolgee → PR into dev
    runs-on: ubuntu-latest
    steps:
      # Отсутствие секрета — КРАСНЫЙ, а не «тихо пропустим». Молчаливый пропуск при
      # незаданном TOLGEE_API_KEY был в прежней джобе и ровно так же скрывал бы факт,
      # что переводы не едут.
      - name: Guard required secrets
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
          I18N_SYNC_TOKEN: ${{ secrets.I18N_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          missing=''
          [ -n "${TOLGEE_API_KEY:-}" ] || missing="$missing TOLGEE_API_KEY"
          [ -n "${I18N_SYNC_TOKEN:-}" ] || missing="$missing I18N_SYNC_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::нет секретов:$missing — синк переводов не может работать без них"
            exit 1
          fi

      # fetch-depth: 0 намеренно. Из мелкого клона force-push ветки, у которой на
      # remote есть история вне клона, отбивается «shallow update not allowed».
      # `token:` кладёт PAT в git-креды, поэтому push ниже идёт под ним же.
      - uses: actions/checkout@v5
        with:
          ref: dev
          token: ${{ secrets.I18N_SYNC_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Pull from Tolgee → open or update the sync PR
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
          GH_TOKEN: ${{ secrets.I18N_SYNC_TOKEN }}
          SYNC_BRANCH: chore/i18n-tolgee-sync
        run: |
          set -euo pipefail

          # Нативный pull (конфиг .tolgeerc.json). Проект на неймспейсах, поэтому CLI
          # раскладывает их по src/lib/i18n/locales/<lang>/<ns>.json с ПЛОСКИМИ ключами
          # — ровно раскладка репозитория. Нормализация (сортировка ключей + перевод
          # строки в конце) убирает шум порядка, чтобы в диффе были ТОЛЬКО реальные
          # изменения переводов.
          npx --yes @tolgee/cli@latest pull
          node scripts/ci/normalize-locale-json.mjs

          if [ -z "$(git status --porcelain src/lib/i18n/locales)" ]; then
            echo 'Tolgee и репозиторий совпадают — PR не нужен.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Ветка одноразовая и принадлежит этому воркфлоу: каждый прогон пересобирает
          # её от свежей верхушки dev, поэтому в PR всегда ОДИН коммит с текущей
          # дельтой — без накопления и без конфликтов. Force тут единственный
          # корректный режим и ничьих чужих коммитов не переписывает.
          git checkout -B "$SYNC_BRANCH"
          git add src/lib/i18n/locales
          # БЕЗ `[skip ci]`: проверки на этом PR обязаны идти. Их отсутствие — половина
          # прежней поломки.
          git commit \
            -m 'chore(i18n): переводы из Tolgee' \
            -m 'Источник истины по содержимому строк — Tolgee; правки локальных JSON перезаписываются по построению.'
          git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"

          # PR уже открыт — он обновился пушем выше. Нет — открываем.
          # Присваивание, а не `[ -n "$(...)" ]`: внутри теста упавший gh дал бы пустую
          # строку и молча увёл нас в ветку «PR нет». В присваивании `set -e` роняет
          # шаг — отказ gh обязан быть красным, а не превращаться в неверную ветку.
          existing=$(gh pr list --head "$SYNC_BRANCH" --base dev --state open --json number --jq '.[].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing уже открыт — обновлён пушем."
            exit 0
          fi

          # Тело PR собирается через printf по строке на аргумент, а не многострочным
          # литералом: содержимое обязано начинаться с нулевой колонки, а внутри
          # блока `run: |` любая строка левее отступа блока рвёт YAML (и `**` в
          # начале строки парсер принимает за алиас).
          printf '%s\n' \
            'Автоматический синк: `tolgee pull` + нормализация. Источник истины по содержимому строк — Tolgee.' \
            '' \
            '**Смотреть перед мерджем — УДАЛЁННЫЕ строки.** Pull перезаписывает файлы локалей целиком, поэтому ключ, заведённый в репозитории руками и не заведённый в Tolgee, будет снесён, а на экране появится сырой ключ. Гард 2x прикрывает только семьи `notif.tpl_*` и `n8n.*` — остальное глазами.' \
            '' \
            'Удаляется что-то нужное → завести строку **в Tolgee** и перезапустить синк (Actions → «Sync translations from Tolgee» → «Run workflow»). Править JSON прямо в этом PR бессмысленно: следующий прогон перетрёт.' \
            '' \
            'Мердж запускает обычный деплой — после него строки у пользователя.' \
            > "$RUNNER_TEMP/pr-body.md"

          gh pr create --base dev --head "$SYNC_BRANCH" \
            --title 'chore(i18n): переводы из Tolgee' \
            --body-file "$RUNNER_TEMP/pr-body.md"
