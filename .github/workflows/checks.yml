# Reusable CI checks for Triplanio (TRIP-73, Ф2).
#
# Single source of truth for the gate, called by BOTH:
#   - ci.yml              (on pull_request — blocks merge)
#   - supabase-deploy.yml (on push to dev/main — gates the deploy via `needs:`)
#
# All three jobs are BLOCKING (the baseline debt that kept typecheck + deno
# informational under TRIP-73 has since been cleared — TRIP-93 / TRIP-94).
#
#   BLOCKING (verified green on dev, 25.06.2026 — Node 22):
#     - frontend  : npm ci → lint → test → build
#     - typecheck : tsc — green since TRIP-93 (26.06.2026). The project is JS/JSX,
#                   so `checkJs` is OFF in jsconfig.json. Its price is a MEASUREMENT
#                   (pinned tsc 5.9.3, `--checkJs --noEmit`, 09.08.2026): 420 errors
#                   in 155 files on the jsconfig perimeter, 401 in 147 across all of
#                   `src/` — both numbers named, because "what checkJs costs" is
#                   undefined without a perimeter. tsc validates syntax / JSX /
#                   imports for the whole tree, AND fully type-checks the growing
#                   opt-in set of files carrying a `// @ts-check` pragma. Add the
#                   pragma to bring a file under real type enforcement; breaking its
#                   types fails THIS gate. Grow coverage file-by-file, no big-bang TS
#                   migration — and guard 2s (below) is what keeps that set from
#                   shrinking, since removing a pragma makes THIS job greener.
#     - deno      : deno check on edge functions — green since TRIP-94 (the 14
#                   pre-existing type errors are fixed; getTripDetails ×10,
#                   getActiveTrips/getFxRates/checkSubscriptionStatus ×3,
#                   getUserPlan ×1). The frontend toolchain never type-checks
#                   functions (jsconfig is src-only; eslint matches src/** .js
#                   only; functions are .ts) — see risk A. esbuild on deploy
#                   catches syntax, NOT types, so this is the only type gate for
#                   functions.
#
# Node 22: the project's `npm test` uses `node --test "src/**/*.test.js"
# "scripts/**/*.test.mjs"` whose globs are expanded by Node's test runner only on
# Node 21+ (Node 20 fails with "Could not find"). Pin 22 so `npm test` runs as written.
name: checks

on:
  workflow_call:

jobs:
  frontend:
    name: Frontend (lint / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # TRIP-321 Ф10: REPORTER, not a gate — it always exits 0. Prints the numbers
      # every TRIP-321 PR must quote (families / classes / inline styles /
      # re-declared shapes) so "was → now" is a measurement in the CI log instead
      # of a claim in the PR body.
      # ЖИВЁТ ЗДЕСЬ, А НЕ В `guards`, ПО ДВУМ ПРИЧИНАМ (TRIP-321 Ф13):
      #   1. У джобы `guards` НЕТ `npm ci`, и это её СВОЙСТВО: все 13 гардов
      #      обходятся стандартной библиотекой и потому стартуют мгновенно. Аудит
      #      разбирает JSX парсером (`acorn` + `acorn-jsx` — см. шапку
      #      scripts/ci/audit-design.mjs: три самодельных разбора подряд оказались
      #      неверны), то есть требует зависимостей. Ставить их в джобу гардов
      #      ради РЕПОРТЁРА = ломать её инвариант ради того, что гардом не является.
      #   2. Репортёру и не место среди гардов: он ничего не блокирует.
      - name: design audit (report only — TRIP-321 progress)
        if: ${{ !cancelled() }}
        run: npm run audit:design

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        # BLOCKING since TRIP-93 (was non-blocking under TRIP-73). Green because
        # checkJs is off (the JS/JSX tree isn't type-checked — that was ~1202 false
        # positives), while files marked `// @ts-check` ARE fully checked. A type
        # break in any opt-in file (or a syntax/import/JSX error anywhere) fails
        # the PR. Mark this check required in branch protection to enforce on merge.
        run: npm run typecheck

  # PR-only guards (TRIP-134). Block a bad PR before it merges; they never touch
  # runtime. Skipped on push (post-merge re-run of this gate) since they diff
  # against the PR base. Each script: 0 ok, 1 violation, 2 internal error.
  #   2a check-migration-numbering   — dup / out-of-order / hand-typed timestamps
  #   2b check-destructive-migrations — DROP/RENAME/ALTER…DROP without opt-in marker
  #   2c check-verify-jwt            — new externally-callable fn missing config.toml pin
  #   2d check-i18n                  — duplicate keys + new hardcoded UI strings
  #   2e check-security-tiers        — grants/policies/EXECUTE drift vs the tier manifest
  #   2f check-dialog-radix          — raw Radix dialog import outside the shell whitelist
  #   2g check-column-caps           — new user text column without a length cap (domain/CHECK)
  #   2h check-edge-sentry           — ANY edge function without withHandler/captureEdgeError/manual
  #   2i check-invoke-seam           — raw supabase.functions.invoke() outside src/lib/invokeFn.js
  #   2j check-analytics-seam        — one door per side: posthog-js only in the seam, init only
  #                                    in the consent gate, ingestion only in captureServer
  #   2k check:design                — raw typography/colour off the tokens + COLOR_WHITELIST ratchet
  #   2l check-inline-styles         — inline styles in touched files may not grow or repeat
  #   2m check-css-prefixes          — a new CSS class-name prefix (namespace) needs approval
  #   2n check-orphan-css            — a rule left pointing at a class the markup stopped emitting
  #   2p check-css-semantics        — итоговые объявления класса: база vs HEAD (ярус 2 виз. гейта)
  #   2q check-design-axes         — обличье канон-объекта вне объявленных осей каталога
  #   2r check-data-door             — табло эпика TRIP-374: ни одно число «единой двери» не растёт
  #   2s check-ts-check              — храповик ВВЕРХ: файл не теряет действующую прагму `// @ts-check`
  #   2t check-db-types              — типы БД не отстали от миграций (отдельной джобой: нужен Docker)
  #   2u check-css-comments          — сломанный /*…*/ роняет правило из бандла (осиротевший/незакрытый)
  #   2v check-error-codes           — реестр кодов ошибок edge-контракта: эмиссия ⊆ словарь + append-only
  #   2w check-invoke-discriminant   — дискриминант отказа invokeFn в корне результата (.data.code/.data.ok не растёт)
  #   2x check-i18n-dynamic-keys     — DB/n8n-only key families (notif.tpl_* + emit()→n8n.*) must not be deleted (TRIP-299)
  #   2y check-spec-columns          — spec-поля table-DML-действия ⊆ колонки таблицы из database.types.ts (TRIP-420)
  #   2ab check-confirm-copy         — every confirm({…}) carries a title AND a description (a11y name + Radix description)
  #   2af check-destructive-confirm  — a destructive control that WRITES must go through confirm() (2ab checks the copy, 2af checks the canon is used at all)
  #   2ac check-site-prefixes        — a new CSS class-name prefix in public/site.css (site DS namespace) needs approval (TRIP-446)
  #   2ad check-site-nav             — internal <a href> in the site zone reloads the doc and drops the campaign mark (TRIP-456)
  #   2ab check-ds-boundary         — the site zone must not import the app's design system (TRIP-446)
  #
  # ONLY on PRs into `dev` (feature-branch → dev), where migrations/strings first
  # enter the codebase. On a `dev → main` promotion PR these would re-scan content
  # already gated and APPLIED to dev — and can't be acted on there (re-stamping an
  # applied migration = journal drift, TRIP-68). So scope them to base=dev.
  guards:
    name: PR guards (migrations / verify_jwt / i18n)
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so we can diff against the base branch
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      - name: 2a — migration numbering
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-migration-numbering.mjs
      - name: 2b — destructive migrations
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-destructive-migrations.mjs
      - name: 2c — verify_jwt for new functions
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-verify-jwt.mjs
      - name: 2d — i18n (dup keys + hardcoded strings)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-i18n.mjs
      - name: 2e — security tiers (manifest self-consistency)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-security-tiers.mjs
      - name: 2f — dialog radix confinement (a11y contract)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-dialog-radix.mjs
      - name: 2ab — confirm() copy contract (title + description)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-confirm-copy.mjs
      - name: 2af — деструктивная запись только через канон-confirm
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-destructive-confirm.mjs
      - name: 2g — column caps (new text columns must be bounded)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-column-caps.mjs
      - name: 2h — edge Sentry coverage (all functions)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-edge-sentry.mjs
      - name: 2i — frontend invoke seam (no raw functions.invoke)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-invoke-seam.mjs
      - name: 2j — analytics seam (events, identity, server ingestion)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-analytics-seam.mjs
      - name: 2k — design tokens (typography/colour + whitelist ratchet)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: npm run check:design
      # TRIP-410: ВРЕМЕННО замьючено. Типографический переезд на Geologica сажает
      # весь текст на каноны разом и по построению фрагментирует смену на десятки
      # маркеров. Возврат — отдельным следующим PR с обновлённой базой (Pavel).
      - name: 2l — inline-style ratchet (repeats belong in the class)
        if: false  # TRIP-410 mute — restore in follow-up PR
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-inline-styles.mjs
      - name: 2m — CSS namespaces (a new class prefix needs approval)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-css-prefixes.mjs
      - name: 2ac — site CSS namespaces (a new prefix in public/site.css needs approval)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-site-prefixes.mjs
      - name: 2ad — site nav (internal links go through the router, not <a href>)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-site-nav.mjs
      - name: 2ae — site primitive dup (класс объявлен одиночкой и в site.css, и в app.css — вторая база)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-site-primitive-dup.mjs
      - name: 2ab — DS boundary (сайтовая зона не импортирует ДС приложения)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-ds-boundary.mjs
      - name: 2n — orphaned CSS (rule left behind after the class moved)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-orphan-css.mjs
      - name: 2u — person avatars carry a stable colour seed
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-avatar-seed.mjs
      # 2r — табло эпика «единая дверь в данные» (TRIP-376, Ф0.4 эпика TRIP-374).
      # Живёт ЗДЕСЬ, а не рядом с 2o/2p: гард обходится стандартной библиотекой
      # (гашение комментариев + регулярка по всему файлу вместо парсера — в его
      # шапке записано, почему не `acorn` и не новая зависимость), то есть не
      # ломает инвариант этой джобы «без `npm ci`».
      #
      # Блокирует только РАТЧЕТ (рост любого из 9 чисел). Дистанция до целей
      # эпика печатается всегда, но красит прогон лишь под `--assert-target`:
      # блокирующая проверка «доехали до цели» была бы красной все Ф1–Ф6, а
      # постоянно красная джоба перестаёт нести информацию и её выключают.
      - name: 2r — data door (табло TRIP-374, ни одно число не растёт)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-data-door.mjs
      # 2aa — storage seam (TRIP-284). Каждая прямая ПИШУЩАЯ дверь Storage
      # (upload/move/remove) объявляет судьбу сбоя: `// storage-report` (уходит в
      # report({surface:'storage'})) или `// storage-soft-fail: …` (осознанный
      # best-effort). Список дверей — из storageWriteSites() табло 2r, второго
      # детектора не заводится. Инвариант по всему дереву (не дифф), как 2h/2i;
      # зависимостей нет (node stdlib) — джоба без `npm ci` не ломается.
      - name: 2aa — storage seam (прямая запись Storage объявляет судьбу сбоя)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-storage-seam.mjs
      # 2s — покрытие типами (TRIP-377, Ф0.1 эпика TRIP-374). Единственный
      # храповик, идущий ВВЕРХ среди гардов этой джобы: `checkJs` выключен, и
      # прагма `// @ts-check` — поштучный вход в проверку. Снять её стоит одной
      # строки, а `npm run typecheck` от этого ЗЕЛЕНЕЕТ (ошибок стало ноль), то
      # есть регресс покрытия выглядит как успех — вот это и блокируется.
      # Зависимостей нет (git + стандартная библиотека), инвариант джобы «без
      # `npm ci`» цел.
      - name: 2s — покрытие типами (прагма @ts-check не пропадает)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-ts-check.mjs
      # 2z — гейт права на фронте ТОЛЬКО через лестницу доступа src/lib/tripStep.js
      # (TRIP-274 Ф2.1). Абсолютный инвариант (HEAD-only, не храповик, BASE_REF не
      # нужен), только стандартная библиотека — инвариант джобы «без `npm ci`» цел.
      # Ловит рукописный гейт (`myRole === 'admin'` / `x === trip.created_by`) мимо
      # `clearsStep`; показ роли (ярлык/бейдж) помечается `// role-gate-exempt`.
      - name: 2z — role gate (право только через лестницу clearsStep)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-role-gate.mjs
      # 2u — целостность CSS-комментариев (TRIP-344). HEAD-only, абсолютный
      # инвариант (не храповик, BASE_REF не нужен), только стандартная библиотека —
      # инвариант джобы `guards` цел. Ловит осиротевший/лишний терминатор и
      # незакрытый комментарий (оба молча роняют правило из бандла). «Сцеленную»
      # форму (правило впитано, файл сбалансирован) НЕ ловит — см. шапку гарда.
      - name: 2u — целостность CSS-комментариев (сломанный /* */ роняет правило)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-css-comments.mjs
      # 2af — полноразмерный слой обязан назвать свой уровень (TRIP-466). Храповик
      # по изменённым CSS (src/ + public/): слой `position:absolute` на весь кадр
      # без `z-index` объявлен в ЧУЖОМ стековом контексте и на мобильном движке
      # всплывает над кадром, как только его промоутят в композитный слой — так
      # обложка накрыла скрим, стрелки и НАЗВАНИЕ ТРИПА на iOS. Ни 2p, ни 2o этого
      # не видели: пропущенного объявления нет с обеих сторон. git + стандартная
      # библиотека — инвариант джобы «без npm ci» цел.
      - name: 2af — слой называет свой уровень (z-index у полноразмерной подложки)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-layer-zindex.mjs
      # 2v — реестр кодов ошибок edge-контракта (TRIP-394, эпик TRIP-374). Коды
      # ошибок = API: edge отдаёт `{error,code}`, клиент (и Flutter в сторе)
      # ветвится по `code`, и договорённость держалась ручным набором одной
      # строки на двух сторонах. Реестр `_shared/errorCodes.ts` делает набор
      # явным словарём; гард держит (a) любой UPPER_SNAKE-код, что edge эмитит,
      # обязан быть в реестре и (b) append-only (код живёт в сторе дольше релиза).
      # git + стандартная библиотека — инвариант джобы «без npm ci» цел.
      - name: 2v — реестр кодов ошибок (edge-эмиссия ⊆ словарь, append-only)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-error-codes.mjs
      # 2w (TRIP-400): дискриминант отказа invokeFn — в КОРНЕ результата, не в
      # `data`. Храповик по диффу: рост `.data.code`/`.data.ok` в тронутом файле →
      # красный (типизация `invokeFn<T>` краснит это же под @ts-check, гард — на
      # весь src). git + стандартная библиотека — без npm ci.
      - name: 2w — дискриминант invokeFn в корне (.data.code/.data.ok не растёт)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-invoke-discriminant.mjs
      - name: 2x — i18n dynamic keys (DB/n8n-only families must not be deleted)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-i18n-dynamic-keys.mjs
      # 3a (TRIP-408 PR#2): карта «код ошибки → i18n-ключ» живёт в ОДНОМ доме
      # `errorText.js` (classifyError). Локальная карта `{ CODE: 'ns.key' }` вне
      # него (три снесённые: AI_ERROR_KEY/BUDGET_REFUSAL/REFUSAL_CLAUSE) → красный.
      # Самосогласованность по дереву; тянет только src/lib/errorCodes.js (0
      # импортов) — инвариант «без npm ci» цел.
      - name: 3a — карта код→i18n одна (локальные карты отказа не воскресают)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-error-i18n-map.mjs
      # 3b (TRIP-408 PR#2): сырой `error.message` пользователю не показывается —
      # канон `classifyError`/`errorText`. Храповик по диффу (как 2w): рост сырых
      # `.message`-показов в тронутом файле → красный; whole-tree итог печатается.
      - name: 3b — сырой текст ошибки пользователю не растёт (.message-показы)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-raw-error-surface.mjs
      # 2y (TRIP-420): spec-поля ресурса ⊆ колонки таблицы. Родня 2t с другой
      # стороны шва: 2t держит типы == миграции, 2y — белый список колонок клиента
      # (fields+forcedOnInsert каждого table-DML-действия) ⊆ колонки из типов.
      # Закрывает класс живого прод-бага: поле-не-колонка доносилось до Postgres
      # (`42703`) сырым 500 (activity + booking_url). Whole-tree, git + стандартная
      # библиотека — инвариант джобы «без npm ci» цел.
      - name: 2y — spec-поля ресурса ⊆ колонки таблицы (класс дефекта activity/500)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-spec-columns.mjs
      # 3c (TRIP-421): один общий хелпер шва. Общие мелкие хелперы (`bad`/`HTTP_URL`/
      # `validateDocuments`/`coord`) живут ОДНИМ домом в каноне (`mutateRules.ts` /
      # `cityFields.ts`) и импортируются; локальная копия тела в `resources/*.ts`,
      # уже живущего в другом ресурсе ИЛИ в каноне, → красный (анти-зоопарк, чтобы
      # дубли не наросли снова после дедупа). Грепа-простой (счётчик глубины по телу,
      # не TS-AST), стандартная библиотека — инвариант джобы «без npm ci» цел.
      - name: 3c — один общий хелпер шва (дубль тела хелпера в ресурсах → красный)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-one-helper.mjs
      # TRIP-321 Ф13: репортёр `audit:design` переехал отсюда в джобу `frontend`.
      # Здесь он требовал бы `npm ci` (разбирает JSX парсером), а эта джоба
      # намеренно обходится стандартной библиотекой - и остаётся такой.

  # 2o — the design floor (TRIP-337 Ф0). Runs `audit-design.mjs` twice (a
  # detached worktree of the PR base, then HEAD) and refuses any growth in the
  # headline numbers: classes / namespaces / inline styles / `:root` tokens.
  #
  # ЖИВЁТ ОТДЕЛЬНОЙ ДЖОБОЙ, А НЕ ШАГОМ В `guards`, ПО ТОЙ ЖЕ ПРИЧИНЕ, ПО КОТОРОЙ
  # ТУДА НЕ ПОЕХАЛ РЕПОРТЁР: у `guards` НЕТ `npm ci`, и это её свойство - все 14
  # гардов обходятся стандартной библиотекой и потому стартуют мгновенно. Аудит
  # разбирает JSX парсером (`acorn` + `acorn-jsx` - в шапке audit-design.mjs
  # записано, почему регулярками это не сходится), то есть требует зависимостей.
  # Ставить их в джобу гардов = ломать её инвариант.
  #
  # `fetch-depth: 0` здесь не «на всякий случай»: гард делает `git worktree add`
  # на базовую ветку и на недостижимой базе ПАДАЕТ, а не пропускает (пол, который
  # ничего не измерил, не должен печатать «OK»).
  design-floor:
    name: Design floor (2o — ни одно число не растёт)
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      # TRIP-410: ВРЕМЕННО замьючено (см. 2l). Возврат — отдельным PR с новой базой.
      - name: 2o — design floor
        if: false  # TRIP-410 mute — restore in follow-up PR
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: npm run check:floor
      # 2p — ЯРУС 2 визуального гейта (TRIP-340 PR3, Р13). Здесь, а не в
      # `guards`, по той же причине, что и 2o: гард разбирает CSS через
      # `postcss` (уже прямая зависимость репо), то есть требует `npm ci`, а
      # `guards` намеренно живёт на стандартной библиотеке.
      # TRIP-410: ВРЕМЕННО замьючено (см. 2l). Возврат — отдельным PR с новой базой.
      - name: 2p — семантический дифф CSS (что реально достаётся классу)
        if: false  # TRIP-410 mute — restore in follow-up PR
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: npm run check:semantics
      # 2q — ОСИ КАНОН-ОБЪЕКТА (TRIP-364). Зависимостей у гарда нет, но он
      # живёт рядом с 2o/2p, потому что читает тот же каталог и отвечает на
      # соседний вопрос: 2o считает, СКОЛЬКО имён, 2q - какие из них ЗАКОННЫ.
      - name: 2q — оси канон-объекта (обличье вне осей)
        if: ${{ !cancelled() }}
        run: npm run check:axes
      # 2y — сырой скин-ПОВЕРХНОСТЬ в теневом <style> внутри .jsx (TRIP-343, §11).
      # Живёт здесь (не в `guards`), потому что разбирает CSS через postcss, как
      # 2p — нужен `npm ci`. HEAD-only абсолютный инвариант (цель 0): поверхность
      # в <style> невидима замеру слоя, её дом — <Card>. Ловит ForkPartnerModal-
      # класс дефекта; сепараторы/плитки в <style> НЕ трогает (предикат аудита).
      - name: 2y — скин-поверхность в теневом <style> (дом поверхности — Card)
        if: ${{ !cancelled() }}
        run: npm run check:shadow-style
      # 2z — реестр полноты поверхностей (Г34, TRIP-343). Каждый .css surface-класс
      # (предикат аудита + <style> + инлайн style={{}}) обязан быть в checked-in
      # таблице `семья→объект`: object:"card" (переехал на <Card>) либо object:<имя>
      # с причиной. Незанесённый класс / устаревшая запись роняют PR; <style>=0;
      # surface-инлайны — ратчет вниз (остаток печатается числом). postcss → рядом
      # с 2o/2p. Иначе «немигрированных = 0» остаётся subset-proof.
      - name: 2z — реестр полноты поверхностей (каждый surface-класс приписан)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: npm run check:surface-registry
      # Репортёр обходов: НЕ блокирует, печатает цену рядом с результатом.
      # Идёт последним и всегда, даже если что-то выше упало, - иначе число
      # обходов не увидят ровно на тех прогонах, где оно интереснее всего.
      - name: обходы гардов (репортёр, не блокирует)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: npm run report:exemptions

  # 2t — ДРЕЙФ ТИПОВ БД (TRIP-383, Ф0.5 эпика TRIP-374). Закоммиченный
  # `supabase/functions/_shared/database.types.ts` обязан совпадать с типами,
  # которые генерируются из `supabase/migrations/**`.
  #
  # ★ ОГРАНИЧЕНИЕ СПОСОБА, названное вслух (полностью — в шапке гарда):
  # генерация типов читает ЖИВУЮ базу, а в CI живой базы нет. Звать оттуда
  # настоящую dev нельзя: миграция из PR к этому моменту ещё НЕ задеплоена, и
  # сверка была бы красной на каждом ПРАВИЛЬНОМ ходе — такой гард выключают.
  # Поэтому здесь поднимается свой Postgres, на него накатываются миграции
  # репо, и сверяются МИГРАЦИИ ↔ ТИПЫ. Предполагается инвариант авто-деплоя
  # «репо == dev == prod» (`db push` катит те же файлы в оба проекта; сверено
  # замером на вводе гарда 09.08.2026 — схемы идентичны). Правку схемы МИМО
  # миграции 2t не видит по построению.
  #
  # ЖИВЁТ ОТДЕЛЬНОЙ ДЖОБОЙ, а не шагом в `guards`, по той же причине, что 2o/2p:
  # производящая половина требует Docker и Supabase CLI, а `guards` намеренно
  # обходится стандартной библиотекой без `npm ci` и потому стартует мгновенно.
  #
  # ТОЛЬКО НА PR В `dev`, как 2o/2p/2q: дрейф заводится правкой, а правка входит
  # в кодовую базу через PR. Гонять спин-ап базы ещё и на каждом push в dev/main
  # значило бы удлинять цепочку деплоя (checks.yml — её гейт) ради вопроса, на
  # который уже ответили на PR.
  #
  # CLI ПИНОВАН той же версией, что в supabase-deploy.yml: две разные версии в
  # репо = два разных генератора, и расхождение читалось бы как дрейф схемы.
  db-types:
    name: DB types (2t — типы БД не отстали от миграций)
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: supabase/setup-cli@v2
        with:
          version: 2.108.0
      - name: Поднять локальный Postgres и накатить supabase/migrations/**
        run: supabase db start
      # РЕТРАЙ здесь не «на всякий случай», а по ЗАМЕРУ: `gen types --local`
      # поднимает СВОЙ контейнер `postgres-meta`, и первый же параллельный
      # прогон двух PR словил `docker: toomanyrequests` от public.ecr.aws —
      # джоба покраснела по инфраструктурной причине, неотличимо с виду от
      # настоящего дрейфа. Гард, красный не по делу, выключают, поэтому три
      # попытки с паузой; если не вышло и с третьей — краснеть ЗАКОННО, и файл
      # останется пустым, что судья назовёт «не смог измерить» (код 2), а не
      # «типы устарели».
      - name: Сгенерировать типы из применённых миграций
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/database.types.gen.ts"
          for attempt in 1 2 3; do
            if supabase gen types typescript --local --schema public > "$out"; then
              exit 0
            fi
            echo "::warning::попытка $attempt/3 сгенерировать типы не удалась (см. вывод выше)"
            sleep $((attempt * 20))
          done
          echo "::error::генерация типов не удалась после 3 попыток"
          exit 1
      - name: 2t — дрейф типов БД
        run: node scripts/ci/check-db-types.mjs "$RUNNER_TEMP/database.types.gen.ts"
      # Сгенерированный файл кладётся артефактом ТОЛЬКО когда гард покраснел:
      # перегенерировать его локально можно лишь с Docker, а он есть не у всех,
      # и без этого «почини типы» — совет без инструмента.
      - name: Сгенерированный файл (для перегенерации без локального Docker)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: database-types-generated
          path: ${{ runner.temp }}/database.types.gen.ts

  deno:
    name: Deno typecheck (edge functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - name: Type-check edge functions
        # BLOCKING since TRIP-94 (the 14 baseline type errors are fixed). A new
        # edge-function type error now fails the gate.
        # --node-modules-dir=none forces Deno's own cache for npm:/URL imports
        # (the repo-root package.json would otherwise push Deno into node_modules
        # mode and fail to resolve npm:stripe etc.). --no-lock keeps CI lock-free.
        run: deno check --no-lock --node-modules-dir=none $(find supabase/functions -name '*.ts')
      - name: Test edge functions (pure logic)
        # BLOCKING. Characterization + unit tests on pure edge-function helpers
        # (no Deno/Stripe/Supabase runtime deps). Guards the payment single-writer
        # (subscriptionRow) so a future refactor can't silently change what the
        # webhook writes. --no-check: types are already covered by the step above.
        run: deno test --no-lock --no-check --node-modules-dir=none $(find supabase/functions -name '*_test.ts')
