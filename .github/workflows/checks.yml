# Reusable CI checks for Triplanio (TRIP-73, Ф2).
#
# Single source of truth for the gate, called by BOTH:
#   - ci.yml              (on pull_request — blocks merge)
#   - supabase-deploy.yml (on push to dev/main — gates the deploy via `needs:`)
#
# All three jobs are BLOCKING (the baseline debt that kept typecheck + deno
# informational under TRIP-73 has since been cleared — TRIP-93 / TRIP-94).
#
#   BLOCKING (verified green on dev, 25.06.2026 — Node 22):
#     - frontend  : npm ci → lint → test → build
#     - typecheck : tsc — green since TRIP-93 (26.06.2026). The project is JS/JSX,
#                   so `checkJs` is OFF in jsconfig.json (it produced ~1202 false
#                   "missing prop" errors on untyped JSX + ~89 in luxon.mjs — noise,
#                   not bugs). tsc now validates syntax / JSX / imports for the
#                   whole tree, AND fully type-checks the growing opt-in set of
#                   files that carry a `// @ts-check` pragma (ratchet — start =
#                   the entitlement/Pro cluster: src/lib/{limits,subscription,
#                   tripAddons}.js). Add `// @ts-check` to a file to bring it under
#                   real type enforcement; breaking its types fails THIS gate. Grow
#                   coverage file-by-file, no big-bang TS migration.
#     - deno      : deno check on edge functions — green since TRIP-94 (the 14
#                   pre-existing type errors are fixed; getTripDetails ×10,
#                   getActiveTrips/getFxRates/checkSubscriptionStatus ×3,
#                   getUserPlan ×1). The frontend toolchain never type-checks
#                   functions (jsconfig is src-only; eslint matches src/** .js
#                   only; functions are .ts) — see risk A. esbuild on deploy
#                   catches syntax, NOT types, so this is the only type gate for
#                   functions.
#
# Node 22: the project's `npm test` uses `node --test "src/**/*.test.js"
# "scripts/**/*.test.mjs"` whose globs are expanded by Node's test runner only on
# Node 21+ (Node 20 fails with "Could not find"). Pin 22 so `npm test` runs as written.
name: checks

on:
  workflow_call:

jobs:
  frontend:
    name: Frontend (lint / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # TRIP-321 Ф10: REPORTER, not a gate — it always exits 0. Prints the numbers
      # every TRIP-321 PR must quote (families / classes / inline styles /
      # re-declared shapes) so "was → now" is a measurement in the CI log instead
      # of a claim in the PR body.
      # ЖИВЁТ ЗДЕСЬ, А НЕ В `guards`, ПО ДВУМ ПРИЧИНАМ (TRIP-321 Ф13):
      #   1. У джобы `guards` НЕТ `npm ci`, и это её СВОЙСТВО: все 13 гардов
      #      обходятся стандартной библиотекой и потому стартуют мгновенно. Аудит
      #      разбирает JSX парсером (`acorn` + `acorn-jsx` — см. шапку
      #      scripts/ci/audit-design.mjs: три самодельных разбора подряд оказались
      #      неверны), то есть требует зависимостей. Ставить их в джобу гардов
      #      ради РЕПОРТЁРА = ломать её инвариант ради того, что гардом не является.
      #   2. Репортёру и не место среди гардов: он ничего не блокирует.
      - name: design audit (report only — TRIP-321 progress)
        if: ${{ !cancelled() }}
        run: npm run audit:design

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        # BLOCKING since TRIP-93 (was non-blocking under TRIP-73). Green because
        # checkJs is off (the JS/JSX tree isn't type-checked — that was ~1202 false
        # positives), while files marked `// @ts-check` ARE fully checked. A type
        # break in any opt-in file (or a syntax/import/JSX error anywhere) fails
        # the PR. Mark this check required in branch protection to enforce on merge.
        run: npm run typecheck

  # PR-only guards (TRIP-134). Block a bad PR before it merges; they never touch
  # runtime. Skipped on push (post-merge re-run of this gate) since they diff
  # against the PR base. Each script: 0 ok, 1 violation, 2 internal error.
  #   2a check-migration-numbering   — dup / out-of-order / hand-typed timestamps
  #   2b check-destructive-migrations — DROP/RENAME/ALTER…DROP without opt-in marker
  #   2c check-verify-jwt            — new externally-callable fn missing config.toml pin
  #   2d check-i18n                  — duplicate keys + new hardcoded UI strings
  #   2e check-security-tiers        — grants/policies/EXECUTE drift vs the tier manifest
  #   2f check-dialog-radix          — raw Radix dialog import outside the shell whitelist
  #   2g check-column-caps           — new user text column without a length cap (domain/CHECK)
  #   2h check-edge-sentry           — ANY edge function without withHandler/captureEdgeError/manual
  #   2i check-invoke-seam           — raw supabase.functions.invoke() outside src/lib/invokeFn.js
  #   2j check-posthog-init          — analytics behind the consent gate (single posthog.init)
  #   2k check:design                — raw typography/colour off the tokens + COLOR_WHITELIST ratchet
  #   2l check-inline-styles         — inline styles in touched files may not grow or repeat
  #   2m check-css-prefixes          — a new CSS class-name prefix (namespace) needs approval
  #   2n check-orphan-css            — a rule left pointing at a class the markup stopped emitting
  #
  # ONLY on PRs into `dev` (feature-branch → dev), where migrations/strings first
  # enter the codebase. On a `dev → main` promotion PR these would re-scan content
  # already gated and APPLIED to dev — and can't be acted on there (re-stamping an
  # applied migration = journal drift, TRIP-68). So scope them to base=dev.
  guards:
    name: PR guards (migrations / verify_jwt / i18n)
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so we can diff against the base branch
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      - name: 2a — migration numbering
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-migration-numbering.mjs
      - name: 2b — destructive migrations
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-destructive-migrations.mjs
      - name: 2c — verify_jwt for new functions
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-verify-jwt.mjs
      - name: 2d — i18n (dup keys + hardcoded strings)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-i18n.mjs
      - name: 2e — security tiers (manifest self-consistency)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-security-tiers.mjs
      - name: 2f — dialog radix confinement (a11y contract)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-dialog-radix.mjs
      - name: 2g — column caps (new text columns must be bounded)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-column-caps.mjs
      - name: 2h — edge Sentry coverage (all functions)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-edge-sentry.mjs
      - name: 2i — frontend invoke seam (no raw functions.invoke)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-invoke-seam.mjs
      - name: 2j — analytics behind the consent gate (single posthog.init)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-posthog-init.mjs
      - name: 2k — design tokens (typography/colour + whitelist ratchet)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: npm run check:design
      - name: 2l — inline-style ratchet (repeats belong in the class)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-inline-styles.mjs
      - name: 2m — CSS namespaces (a new class prefix needs approval)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-css-prefixes.mjs
      - name: 2n — orphaned CSS (rule left behind after the class moved)
        if: ${{ !cancelled() }}
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: node scripts/ci/check-orphan-css.mjs
      # TRIP-321 Ф13: репортёр `audit:design` переехал отсюда в джобу `frontend`.
      # Здесь он требовал бы `npm ci` (разбирает JSX парсером), а эта джоба
      # намеренно обходится стандартной библиотекой - и остаётся такой.

  # 2o — the design floor (TRIP-337 Ф0). Runs `audit-design.mjs` twice (a
  # detached worktree of the PR base, then HEAD) and refuses any growth in the
  # headline numbers: classes / namespaces / inline styles / `:root` tokens.
  #
  # ЖИВЁТ ОТДЕЛЬНОЙ ДЖОБОЙ, А НЕ ШАГОМ В `guards`, ПО ТОЙ ЖЕ ПРИЧИНЕ, ПО КОТОРОЙ
  # ТУДА НЕ ПОЕХАЛ РЕПОРТЁР: у `guards` НЕТ `npm ci`, и это её свойство - все 14
  # гардов обходятся стандартной библиотекой и потому стартуют мгновенно. Аудит
  # разбирает JSX парсером (`acorn` + `acorn-jsx` - в шапке audit-design.mjs
  # записано, почему регулярками это не сходится), то есть требует зависимостей.
  # Ставить их в джобу гардов = ломать её инвариант.
  #
  # `fetch-depth: 0` здесь не «на всякий случай»: гард делает `git worktree add`
  # на базовую ветку и на недостижимой базе ПАДАЕТ, а не пропускает (пол, который
  # ничего не измерил, не должен печатать «OK»).
  design-floor:
    name: Design floor (2o — ни одно число не растёт)
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      - name: 2o — design floor
        env: { BASE_REF: 'origin/${{ github.base_ref }}' }
        run: npm run check:floor

  deno:
    name: Deno typecheck (edge functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - name: Type-check edge functions
        # BLOCKING since TRIP-94 (the 14 baseline type errors are fixed). A new
        # edge-function type error now fails the gate.
        # --node-modules-dir=none forces Deno's own cache for npm:/URL imports
        # (the repo-root package.json would otherwise push Deno into node_modules
        # mode and fail to resolve npm:stripe etc.). --no-lock keeps CI lock-free.
        run: deno check --no-lock --node-modules-dir=none $(find supabase/functions -name '*.ts')
      - name: Test edge functions (pure logic)
        # BLOCKING. Characterization + unit tests on pure edge-function helpers
        # (no Deno/Stripe/Supabase runtime deps). Guards the payment single-writer
        # (subscriptionRow) so a future refactor can't silently change what the
        # webhook writes. --no-check: types are already covered by the step above.
        run: deno test --no-lock --no-check --node-modules-dir=none $(find supabase/functions -name '*_test.ts')
