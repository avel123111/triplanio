    <!-- Google Consent Mode v2 default (TRIP-311). Runs before anything else can
         load a tag, and deliberately calls a FUNCTION: dataLayer.push([...]) with
         an array is silently ignored for consent commands. Everything Google can
         store stays denied until the visitor answers the banner; consent.js sends
         the update. Functionality/security are granted — they are the storage the
         service cannot run without. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted'
      });
    </script>

    <!-- ★ ОДИН текст на три тега: description / og:description / twitter:description.
         Две формулировки одного и того же разъезжаются на первой правке — а поиск
         и мессенджер должны обещать одно и то же (аудит TRIP-445). Меняешь —
         меняй все три. -->
    <meta name="description" content="Triplanio is a travel-planning app for complex multi-city trips. Build itineraries, plan together, track budgets in any currency, and get smart reminders." />
    <!-- SEO/social preview (TRIP-448). index.html — ОДИН файл на ВСЕ SPA-роуты
         (rewrites → /index.html), поэтому эти теги становятся превью ПО УМОЛЧАНИЮ
         для любого адреса без своего механизма. Это осознанно: лендинг — то, чем
         делятся, и он получает правильное превью; /join/* перекрывается раньше
         своим OG (middleware.js), /public/trip/:id получит своё позже, а внутренние
         экраны приложения наружу ссылками не расходятся. НЕ считать «багом», что
         они общие — не «чинить» это добавлением per-route значений сюда.

         ★ canonical и og:url СЮДА НЕ КЛАДЁМ НАМЕРЕННО. Любой абсолютный URL здесь
         был бы ОДИН на всём сайте: <link rel=canonical href=".../"> сказал бы
         Google, что КАЖДАЯ страница — дубль главной (первой погибла бы будущая
         демо-страница), а og:url свёл бы любую расшаренную ссылку к лендингу. Без
         них поведение верное: Google само-канонизирует каждый URL. Понадобится
         canonical — только по-маршрутно из React (Ф6), не здесь.

         ★ hreflang НЕ добавляем: язык не в адресе (I18nContext держит его в
         состоянии, маршрутов /en/, /ru/ нет), а hreflang связывает РАЗНЫЕ URL —
         связывать нечего. Появится только вместе с i18n на уровне адресов.

         ★ og:image / twitter:image — АБСОЛЮТНЫМ URL: относительный путь молча не
         подхватывается частью краулеров. -->

    <meta property="og:description" content="Triplanio is a travel-planning app for complex multi-city trips. Build itineraries, plan together, track budgets in any currency, and get smart reminders." />

    <!-- site.css принадлежит SiteChrome (инжектится только на marketing/public роутах). -->
    <!-- Шрифты НЕ предзагружаются намеренно (TRIP-328). index.html — один файл на ВСЕ
         SPA-роуты (rewrites → /index.html), а гарнитуры разнятся по роутам: marketing/public
         рисует Golos Text, приложение — Geologica, JetBrains Mono только для кодов. Любой
         статический <link rel=preload as=font> здесь оказывается «unused» на части роутов →
         варнинг "was preloaded but not used" (ловушка TRIP-202); ручной список ещё и молча
         протухает при смене типографики (так появился мёртвый preload Exo 2 после TRIP-410).
         Корректность и раннюю отрисовку дают сами @font-face (src/design/fonts.css):
         font-display:swap (текст сразу в fallback, без FOIT) + unicode-range (грузится только
         нужный сабсет). В этом SPA HEAD-preload шрифтов — нетто-вредный микро-опт: LCP задаёт
         fallback-кадр, а лишние высокоприоритетные woff2 отнимают полосу у критичного бандла. -->
    <!-- ═══ Экран запуска (TRIP-478) ═══════════════════════════════════════
         ДО бандла работать может только то, что лежит ЗДЕСЬ: стили инлайном,
         знак и слово — инлайновым SVG. Внешний файл (link/preload) для splash
         бессмыслен по построению — он приедет тогда же, когда и приложение,
         то есть когда заставка уже не нужна.

         ★ ЦВЕТА ПРОДУБЛИРОВАНЫ ЛИТЕРАЛАМИ НАМЕРЕННО. Токены (`--bg`, `--ink`)
         объявлены в `src/design/app.css`, который грузится бандлом, поэтому на
         splash никакой `var()` ещё не разрешается. Значения ниже = копия
         `--bg`/`--ink` обеих тем; МЕНЯЕШЬ ИХ В app.css — ПОМЕНЯЙ И ЗДЕСЬ,
         иначе первый кадр разъедется с приложением (расхождение видно только
         глазом: ни один гард сюда не смотрит, index.html вне их периметра).
         Синий знака (#2173C8) — не токен темы, а константа логотипа: он один
         и тот же в светлой и тёмной (в тёмной `--brand` другой, знак — нет). -->
    <script>
      // Тема ДО первой отрисовки. Владелец темы — ThemeProvider
      // (`src/lib/ThemeContext.jsx`), но он ставит [data-theme] в useEffect,
      // то есть уже ПОСЛЕ маунта: до этого мига документ всегда светлый, и в
      // тёмной теме первый кадр был вспышкой белого. Здесь читаются ТЕ ЖЕ
      // ключи В ТОМ ЖЕ порядке (`tp-theme`, затем легаси `triplanio:theme`),
      // и первый же эффект провайдера перезапишет атрибут своим значением —
      // источник правды не раздваивается, это лишь ранняя подстановка.
      // Меняешь ключи или правило 'system' — меняй в обоих местах.
      try {
        var t = localStorage.getItem('tp-theme') || localStorage.getItem('triplanio:theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) { /* приватный режим: остаёмся на светлой */ }
    </script>
    <style>
      .splash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:22px;background:#f7f9fa;
        transition:opacity .32s ease}
      :root[data-theme="dark"] .splash{background:#0c0e1c}
      /* Уход. Узел снимает `hideSplash()` (src/lib/splash.js) — там же продублирована
         длительность .32s: CSS-переменную JS прочитать может, но ради одного числа
         это лишний слой, поэтому числа связаны комментарием с обеих сторон. */
      .splash[data-out]{opacity:0;pointer-events:none}

      .splash__mark{display:block;width:132px;height:132px}
      .splash__word{display:block;width:126px;height:auto;fill:#272433}
      :root[data-theme="dark"] .splash__word{fill:#EDECF4}

      /* Знак собирается каскадом: плашка, затем четыре фигуры по очереди
         в порядке взлёта — волна (низ слева) → самолёт → след → нос. Порядок
         в РАЗМЕТКЕ трогать нельзя (это z-порядок логотипа), поэтому очередь
         задана задержками по nth-child, а не перестановкой узлов. */
      .splash__plate{animation:splash-plate .45s cubic-bezier(.34,1.3,.64,1) both}
      .splash__art path{opacity:0;transform:scale(.86);transform-box:fill-box;transform-origin:center;
        animation:splash-pop .5s cubic-bezier(.22,1,.36,1) forwards}
      .splash__art path:nth-child(1){animation-delay:.23s} /* самолёт */
      .splash__art path:nth-child(2){animation-delay:.12s} /* волна   */
      .splash__art path:nth-child(3){animation-delay:.34s} /* след    */
      .splash__art path:nth-child(4){animation-delay:.45s} /* нос     */
      /* Слово идёт ВНАХЛЁСТ со знаком (вариант S2): шторка стартует на .34s,
         когда знак собран наполовину, и не ждёт его конца (.95s). */
      .splash__word{clip-path:inset(0 100% 0 0);animation:splash-wipe .46s cubic-bezier(.33,.9,.3,1) .34s forwards}

      @keyframes splash-plate{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
      @keyframes splash-pop{to{opacity:1;transform:none}}
      @keyframes splash-wipe{to{clip-path:inset(0 0 0 0)}}

      /* Просьбу убрать движение выполняем целиком: ни каскада, ни шторки —
         знак и слово проступают одним мягким появлением. */
      @media (prefers-reduced-motion: reduce){
        .splash__plate,.splash__art path,.splash__word{animation:none}
        .splash__art path{opacity:1;transform:none}
        .splash__word{clip-path:none}
        .splash{animation:splash-calm .45s ease-out both}
        @keyframes splash-calm{from{opacity:0}to{opacity:1}}
      }
    </style>
  </head>
