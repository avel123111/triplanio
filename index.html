<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Consent Mode v2 default (TRIP-311). Runs before anything else can
         load a tag, and deliberately calls a FUNCTION: dataLayer.push([...]) with
         an array is silently ignored for consent commands. Everything Google can
         store stays denied until the visitor answers the banner; consent.js sends
         the update. Functionality/security are granted — they are the storage the
         service cannot run without. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted'
      });
    </script>
    <!-- ★ <html lang> — ставится СИНХРОННО, ДО первого кадра (TRIP-515).
         Стоит ПОСЛЕ блока Consent Mode (у того в шапке «runs before anything else
         can load a tag»): порядок читается глазами, а сам скрипт тегов не грузит —
         только выставляет атрибут.
         Статический lang="en" врал: язык интерфейса — профиль или язык браузера
         (I18nContext), а SPA при загрузке отдаёт пустой <body>. Chrome/Safari
         читают lang и английские title/meta и РЕШАЮТ «страница английская» ДО
         того, как React выставит настоящий язык, — и встроенный переводчик
         предлагает перевод. Дальше он удаляет наши текстовые узлы и вставляет
         свои внутри <font>; React продолжает считать удалённый узел своим →
         insertBefore бросает (краш всего приложения) и nodeValue уходит в никуда
         (залипший текст). translate="no" выше глушит встроенные переводчики; этот
         скрипт снимает саму ПРИЧИНУ перевода — ставит верный lang до кадра.
         Это РУЧНАЯ КОПИЯ detectLandingLang() (src/lib/i18n/translations.js) —
         пре-пейнт <script> модуль импортировать не может. Три литерала ниже (коды,
         ключ хранилища, имя параметра) сверяются с экспортами того модуля тестом
         src/lib/i18n/htmlLang.test.js, поэтому молча разъехаться не могут. Дальше
         владелец атрибута — слой i18n (I18nContext). -->
    <script>
      (function () {
        try {
          // ★ ИСПЕЧЁННЫЙ ДОКУМЕНТ УЖЕ ЗНАЕТ СВОЙ ЯЗЫК (TRIP-520). Четыре
          // публичные страницы приезжают готовыми файлами, по файлу на язык, и
          // `lang` в них проставлен выпечкой под содержимое файла. Пересчитай
          // его здесь по браузеру — и на английском файле оказалось бы
          // lang="ru": ровно та причина, по которой встроенный переводчик
          // предлагает перевод и ломает DOM, то есть баг, который этот скрипт и
          // закрывает. Признак ставит выпечка, живого приложения он не касается.
          if (document.documentElement.hasAttribute('data-prerendered')) return;
          var CODES = ['ru', 'en', 'es'];
          var KEY = 'travel-planner-lang';
          var PARAM = 'lang';
          var pick = null;
          try {
            var q = new URLSearchParams(window.location.search).get(PARAM);
            if (q && CODES.indexOf(q) >= 0) pick = q;
          } catch (e) { /* приватный режим/SSR */ }
          if (!pick) {
            try {
              var s = localStorage.getItem(KEY);
              if (s && CODES.indexOf(s) >= 0) pick = s;
            } catch (e) { /* приватный режим */ }
          }
          if (!pick) {
            var b = (navigator.language || 'en').slice(0, 2);
            pick = CODES.indexOf(b) >= 0 ? b : 'en';
          }
          document.documentElement.setAttribute('lang', pick);
        } catch (e) { /* остаётся статический lang="en" */ }
      })();
    </script>
    <!-- Favicon: SVG первым — современные браузеры берут его и игнорируют
         остальное. .ico оставлен фолбэком для старых и для ботов/читалок,
         которые дёргают /favicon.ico по конвенции, не читая разметку.
         apple-touch-icon непрозрачный и НЕскруглённый намеренно: iOS скругляет
         сам, а альфа в нём даёт чёрные углы на домашнем экране (TRIP-479). -->
    <link rel="icon" type="image/svg+xml" href="/triplanio-logo.svg" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="google-site-verification" content="Jtn6m7Y4ILNIefFuOmuzt63AyuQohMoUmxVg8kJyiow" />
    <meta name="impact-site-verification" value="75cd6594-dce5-4983-9116-8ad4086f84a6" />
    <link rel="manifest" href="/manifest.json" />
    <!-- ★★ ЛИЦА ШРИФТОВ — ПЕРВЫМИ И БЛОКИРУЮЩЕ (TRIP-520).
         Их нужно объявить ДО первого кадра, иначе текст успевает нарисоваться
         системной гарнитурой и перенабирается, когда лица приедут. Отдельной
         таблицей, а не внутри стилей приложения: те у испечённых страниц
         неблокирующие, и шрифты вместе с ними откладывались на полсекунды
         ПОСЛЕ отрисовки (замер: кадр 1812 мс, запрос за шрифтом 2525 мс).
         Файл общий на оба слоя — разбор в его шапке. -->
    <link rel="stylesheet" href="/fonts.css" />
    <title>Triplanio — Your whole trip. One beautiful plan.</title>
    <!-- ★ ОДИН текст на три тега: description / og:description / twitter:description.
         Две формулировки одного и того же разъезжаются на первой правке — а поиск
         и мессенджер должны обещать одно и то же (аудит TRIP-445). Меняешь —
         меняй все три. -->
    <meta name="description" content="Triplanio is a travel-planning app for complex multi-city trips. Build itineraries, plan together, track budgets in any currency, and get smart reminders." />
    <!-- SEO/social preview (TRIP-448, переосмыслено TRIP-520).
         ★ ЭТОТ ФАЙЛ — ШАБЛОН, А НЕ КОНЕЧНАЯ СТРАНИЦА. На сборке он раздваивается:
         оболочка SPA уезжает в `app.html` (её отдают все адреса, у которых нет
         готового файла), а из него же выпечка собирает по файлу на каждую
         публичную страницу — с ЕЁ заголовком, ЕЁ описанием, ЕЁ og-тегами и ЕЁ
         canonical (`scripts/build/prerender.mjs`).

         Значит теги ниже — уже не «превью по умолчанию для всего сайта», а
         запасное значение для оболочки: экраны приложения наружу ссылками не
         расходятся, а у всех, кто расходится, теперь свои. Правило «один текст на
         три тега» (description / og / twitter) остаётся: выпечка подставляет их
         тройками из одного источника.

         ★ canonical, hreflang и og:url СЮДА ПО-ПРЕЖНЕМУ НЕ КЛАДЁМ. Любой
         абсолютный URL здесь был бы ОДИН на всём сайте: canonical объявил бы
         каждую страницу дублем главной, og:url свёл бы любую расшаренную ссылку к
         лендингу.

         canonical и hreflang приезжают по-маршрутно: их ставит React (`SiteZone`),
         а выпечка снимает со страницы вместе с содержимым. ★ og:url НЕ СТАВИТ
         НИКТО, и это не забытый пункт: превью строится по адресу, по которому
         мессенджер и пришёл, а разойтись с ним og:url может только во вред —
         платить за это лишним владельцем абсолютного адреса незачем.

         ★ og:image / twitter:image — АБСОЛЮТНЫМ URL: относительный путь молча не
         подхватывается частью краулеров. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Triplanio" />
    <meta property="og:title" content="Triplanio — Your whole trip. One beautiful plan." />
    <meta property="og:description" content="Triplanio is a travel-planning app for complex multi-city trips. Build itineraries, plan together, track budgets in any currency, and get smart reminders." />
    <meta property="og:image" content="https://www.triplanio.com/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Triplanio — Your whole trip. One beautiful plan." />
    <meta name="twitter:description" content="Triplanio is a travel-planning app for complex multi-city trips. Build itineraries, plan together, track budgets in any currency, and get smart reminders." />
    <meta name="twitter:image" content="https://www.triplanio.com/og-cover.jpg" />

    <!-- Site-wide structured data. Page-scoped types are injected per route from
         React; see src/components/site/jsonLd.js.
         Organization.logo reuses the PWA icon (/icon-512.png, the same file
         manifest.json lists) — one raster to regenerate when the mark changes;
         the SVG master of the mark is public/triplanio-logo.svg (TRIP-479). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.triplanio.com/#organization",
            "name": "Triplanio",
            "url": "https://www.triplanio.com/",
            "logo": "https://www.triplanio.com/icon-512.png",
            "email": "info@triplanio.com"
          },
          {
            "@type": "WebSite",
            "@id": "https://www.triplanio.com/#website",
            "name": "Triplanio",
            "url": "https://www.triplanio.com/",
            "publisher": { "@id": "https://www.triplanio.com/#organization" }
          }
        ]
      }
    </script>
    <!-- site.css принадлежит SiteChrome (инжектится только на marketing/public роутах). -->
    <!-- Шрифты НЕ предзагружаются намеренно (TRIP-328). index.html — один файл на ВСЕ
         SPA-роуты (rewrites → /index.html), а гарнитуры разнятся по роутам: marketing/public
         рисует Golos Text, приложение — Geologica, JetBrains Mono только для кодов. Любой
         статический <link rel=preload as=font> здесь оказывается «unused» на части роутов →
         варнинг "was preloaded but not used" (ловушка TRIP-202); ручной список ещё и молча
         протухает при смене типографики (так появился мёртвый preload Exo 2 после TRIP-410).
         Корректность и раннюю отрисовку дают сами @font-face (public/fonts.css):
         font-display:swap (текст сразу в fallback, без FOIT) + unicode-range (грузится только
         нужный сабсет). В этом SPA HEAD-preload шрифтов — нетто-вредный микро-опт: LCP задаёт
         fallback-кадр, а лишние высокоприоритетные woff2 отнимают полосу у критичного бандла. -->
    <!-- ═══ Экран запуска (TRIP-478) ═══════════════════════════════════
         Ни разметки, ни стилей заставки ЗДЕСЬ НЕТ — и это несущее. Источник
         правды живёт в дизайн-системе (`src/design/splash.css` + `.html`), а
         сюда подставляется на сборке плагином `inline-splash`
         (`vite.config.js`). Копии не существует: тот же файл рисует витрина
         `/kit/splash`, поэтому увиденное на витрине и увиденное при запуске
         не могут разойтись.

         Инлайном, а не `<link>`/`<script>`: заставка обязана работать ДО
         бандла, а внешний файл приехал бы вместе с приложением — то есть
         когда она уже не нужна.

         Возврат разметки сюда руками закрыт тестом (`src/lib/splash.test.js`).
         ══════════════════════════════════════════════════════════════════ -->
    <!--splash:style-->
  </head>
  <body>
    <!--splash:markup-->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
